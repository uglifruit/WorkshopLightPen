summary: |
  LIGHTPEN drives an RGB sensor wand: three light-dependent resistors under
  red, green and blue gels in a marker-pen body, powered from CV Out 1 and
  read on CV In 1, CV In 2 and Audio In 2. Point it at the room or scan
  printed colour, and the colour becomes CV, gates and audio.<br><br>

  X sets sensitivity and Y smoothing in every mode. Switch Up steps through
  eight modes; Down is each mode's action — and in the three modes that
  record, a quick tap of Down cycles the sound or behaviour while a longer
  press still records.<br><br>

  The LEDs are two columns of three: the left (0, 2, 4) counts the mode as a
  three-bit number, and the right is a live meter of red (LED 1), green (3)
  and blue (5). The meter shows the reading the modes act on — after
  calibration, sensitivity and smoothing — so it is also how you set the card
  up: a colour pinned at full brightness or staying dark as the wand moves
  means the modes see that too.<br><br>

  1 RGB CV Mirror: colour as three CVs, plus threshold gates.
  2 Triad Drone: red, green and blue set the levels of a chord's three notes.
  3 Barcode Reader: swipe across a black-and-white code while holding Down,
  and its bars loop as triggers — every element on one pulse out, the wide
  ones on the other, with the black/white gate as CV. It also plays drums: a
  bar going dark hits a kick and coming back to light hits a snare, or
  clicks, crackle or shaped noise, tapped through with the switch.
  4 Tape Scrubber: hold Down to record Audio In 1 for as long as you hold it,
  then scrub through the take by moving the wand across a colour map, with a
  colour-controlled filter. Tap Down to switch between scrubbing, repeating
  one of sixteen slices, and sweeping the loop length down to a buzz.
  5 Synesthesia Voice: a 1V/oct voice whose filter, wavefolder and decay
  follow the colour.
  6 Colour Organ: hue picks a note in a scale, as calibrated pitch CV,
  triggers and an organ tone.
  7 Jog Wheel: the same take runs as a loop and the wand sets its speed,
  from a nudge to a full shuttle into reverse, against a flywheel whose
  weight the colour controls. Tap Down for a motorless platter your hand
  drives entirely, or a brake that stops when you cover the sensor.
  8 Prism Voice: a sustaining voice with FM, sample-rate crush and filter
  on the three colours.<br><br>

  Hold Down at power-on to calibrate: five captures, one per tap. Show it
  red, green, blue, white and black and it measures how much each gel leaks
  the other colours and un-mixes them, so blue reads as blue rather than as a
  grey lift on all three, then reports how well the gels separate, one LED to
  five. Show it white for the first four taps instead and it calibrates level
  alone — setting each channel's range and straightening its response, an LDR
  being a power-law device whose raw reading bunches up at the bright end.
  There is no mode to pick: white is the sum of the primaries, so the
  captures themselves say which calibration was meant. It is saved to flash
  and survives power-off.<br><br>

  Two pages to open full-screen on whatever screen you are scanning, both in
  tools/ and both on the web — the calibration targets
  (https://uglifruit.github.io/WorkshopLightPen/tools/calibration-target.html)
  and nine colour maps
  (https://uglifruit.github.io/WorkshopLightPen/tools/colour-maps.html): the
  red/green field the tape scrubber was designed around, a hue sweep that
  plays as a rising scale, barcodes for the barcode reader, and saturated
  fields for the drone.<br><br>

  Still in development: builds and passes its desktop DSP checks, not yet
  played on hardware.
